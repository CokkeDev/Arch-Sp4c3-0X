# Orbital — picom
# En VMware, si ves parpadeos o picom no arranca, cambia backend a "xrender"
# (perderás el blur, el resto funciona igual).

backend = "glx";
vsync = true;
use-damage = true;

# Esquinas redondeadas (la polybar dibuja las suyas)
corner-radius = 10;
rounded-corners-exclude = [
  "name = 'OrbitalBg'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Sombras suaves
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'OrbitalBg'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Blur detrás de kitty (el fondo ASCII se ve difuminado)
blur-method = "dual_kawase";
blur-strength = 3;
blur-background-exclude = [
  "name = 'OrbitalBg'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'flameshot'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Transiciones
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
