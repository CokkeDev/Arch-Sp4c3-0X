; Orbital — polybar en módulos flotantes (estilo S4vitar)
; Cada "píldora" es una barra separada. Las de la izquierda se anclan al borde
; izquierdo, la de escritorios al centro y las de la derecha al borde derecho,
; así funciona en cualquier resolución.
; Los @ICONOS@ los reemplaza install.sh por glifos de Nerd Font.

[colors]
bg      = #0b0e17
border  = #1d2333
fg      = #e6e9ef
dim     = #8a93a6
accent  = #5b7cfa
sky     = #8fa4ff
cyan    = #6fd3e8
gold    = #e5c76b
green   = #9bd59a
red     = #ff4d5e
empty   = #4a5163

; ---------------------------------------------------------------- base ----
[section/pill]
monitor = ${env:MONITOR:}
height = 34
offset-y = 8
radius = 8
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 1
border-color = ${colors.border}
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = JetBrainsMono Nerd Font Propo:size=14;4
override-redirect = true
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

; ------------------------------------------------------------- izquierda --
[bar/logo]
inherit = section/pill
width = 40
offset-x = 12
padding-left = 0
padding-right = 0
modules-center = arch

[bar/ethernet]
inherit = section/pill
width = 170
offset-x = 60
modules-center = ethernet

[bar/vpn]
inherit = section/pill
width = 210
offset-x = 238
modules-center = vpn

; ---------------------------------------------------------------- centro --
[bar/workspaces]
inherit = section/pill
width = 210
offset-x = 50%:-105
modules-center = bspwm

; --------------------------------------------------------------- derecha --
[bar/target]
inherit = section/pill
width = 220
offset-x = 100%:-726
border-color = ${colors.red}
modules-center = target

[bar/system]
inherit = section/pill
width = 240
offset-x = 100%:-498
modules-center = cpu memory network

[bar/clock]
inherit = section/pill
width = 190
offset-x = 100%:-250
modules-center = date

[bar/power]
inherit = section/pill
width = 40
offset-x = 100%:-52
padding-left = 0
padding-right = 0
modules-center = power

; --------------------------------------------------------------- módulos --
[module/arch]
type = custom/text
format = %{T2}@ARCH@%{T-}
format-foreground = ${colors.accent}
click-left = rofi -show drun -theme ~/.config/rofi/orbital.rasi

[module/ethernet]
type = custom/script
exec = ~/.config/polybar/scripts/ethernet_status.sh
interval = 3

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn_status.sh
interval = 3

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target_to_hack.sh
interval = 2
; clic: copia la IP del objetivo al portapapeles
click-left = xclip -sel clip -r ~/.config/archhacker/target_ip

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
format = <label-state>

label-focused = ●
label-focused-font = 2
label-focused-foreground = ${colors.accent}
label-focused-padding = 1

label-occupied = ○
label-occupied-font = 2
label-occupied-foreground = ${colors.gold}
label-occupied-padding = 1

label-urgent = ●
label-urgent-font = 2
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

label-empty = ·
label-empty-font = 2
label-empty-foreground = ${colors.empty}
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "@CPU@ "
format-prefix-foreground = ${colors.sky}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "@MEM@ "
format-prefix-foreground = ${colors.sky}
label = %percentage_used%%

[module/network]
type = internal/network
interface-type = wired
interval = 2
format-connected-prefix = "↓ "
format-connected-prefix-foreground = ${colors.sky}
label-connected = %downspeed:6%
label-disconnected = "—"
label-disconnected-foreground = ${colors.dim}

[module/date]
type = internal/date
interval = 1
time = %H:%M
date = %a %d/%m/%y
label = %{F#e5c76b}@CLOCK@%{F-} %{F#e6e9ef}%time%%{F-} %{F#8a93a6}%date%%{F-}

[module/power]
type = custom/text
format = %{T2}@POWER@%{T-}
format-foreground = ${colors.red}
click-left = ~/.config/polybar/scripts/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
