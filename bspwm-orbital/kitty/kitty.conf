# Orbital — kitty

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

# Ventana
window_padding_width   10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell      no
background_opacity     0.82
dynamic_background_opacity yes

# Cursor
cursor_shape  block
cursor_blink_interval 0.55

# Splits dentro de kitty (además del tiling de bspwm)
enabled_layouts splits,stack
map ctrl+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+minus launch --cwd=current --location=hsplit
map ctrl+shift+z     toggle_layout stack
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down
active_border_color   #5b7cfa
inactive_border_color #2a3142

# Paleta Orbital
foreground            #e6e9ef
background            #05070f
selection_foreground  #05070f
selection_background  #8fa4ff
cursor                #5b7cfa
cursor_text_color     #05070f
url_color             #6fd3e8

